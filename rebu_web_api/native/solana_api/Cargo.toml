[package]
name = "solana_api"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "solana_api"
path = "src/main.rs"

[lib]
name = "solana_api"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.36.1"
anchor-client = { version = "0.30.1", features = ["async"] }
anchor-lang = "0.30.1"
anchor-spl = { version = "0.30.1", features = ["associated_token", "token_2022"] }
tokio = { version = "1.0", features = ["full"] }
