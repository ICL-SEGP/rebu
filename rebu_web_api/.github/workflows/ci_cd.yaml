# in workflows/ci_cd.yaml

name: CI Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  OTP_VRSN: 27.1.3
  ELIXIR_VRSN: 1.18.2
  MIX_ENV: test

defaults:
  run:
    working-directory: ./rebu_web_api

jobs:
  ci:
    runs-on: ubuntu-latest
    name: Compile with mix test, format & unused deps check
    env:
      MIX_ENV: test
    services:
      postgres:
        image: postgres:15.2
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v3

      - name: Setup Elixir v${{ env.ELIXIR_VRSN }}-otp-${{ env.OTP_VRSN }}
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VRSN }}
          elixir-version: ${{ env.ELIXIR_VRSN }}

      - name: Cache deps directory
        uses: actions/cache@v4
        id: cache-deps
        with:
          path: |
            rebu_web_api/deps
            rebu_web_api/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Cache plt files
        uses: actions/cache@v4
        env:
          EX_OTP_VERSIONS: ${{ steps.setup-beam.outputs.elixir-version }}
          KEY_BASE: plt-${{ runner.os }}-${{ env.EX_OTP_VERSIONS }}
        with:
          path: |
            rebu_web_api/priv/plts
          key: |
            ${{ env.KEY_BASE }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ env.KEY_BASE }}-

      - name: Get dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: pwd && mix deps.get

      - run: mix compile

      - name: Run tests
        run: mix test --max-failures 1 --trace --warnings-as-errors

      - name: Check code is formatted
        run: mix format --check-formatted

      # - name: Dialyzer static analysis
      #   run: MIX_ENV=dev mix dialyzer --format github

      - name: Checks unused dependencies
        run: mix deps.unlock --check-unused

  build-push:
    runs-on: ubuntu-latest
    needs: ci
    name: Build Docker image & push to ghcr.io
    outputs:
      unique_docker_tag: ${{ steps.get-unique-docker-tag.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v3

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GH_PAT }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: |
            ghcr.io/icl-segp/rebu/rebu_web_api
          tags: |
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - uses: docker/build-push-action@v5
        with:
          context: ./rebu_web_api
          cache-from: type=registry,ref=ghcr.io/icl-segp/rebu/rebu_web_api:cache
          cache-to: type=registry,ref=ghcr.io/icl-segp/rebu/rebu_web_api:cache,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          build-args: |
            ELIXIR_VERSION=${{ env.ELIXIR_VRSN }}
            OTP_VERSION=${{ env.OTP_VRSN }}

      - name: Gets unique image tag
        id: get-unique-docker-tag
        if: github.ref == 'refs/heads/main'
        run: |-
          IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" \
                      | grep 'sha' \
                      | tr '\n' ' ' \
                      | awk '{print $1}')
          echo "sha_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT


  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-push
    name: Deploy application
    steps:
      - uses: actions/checkout@v4

      - name: Setup SOPS
        uses: nhedger/setup-sops@v2
        with:
          version: 3.7.3

      - uses: alessiodionisi/setup-age-action@v1.3.0
        with:
          version: ^1.1.0

      - name: Create age and SSH key files
        shell: bash
        run: |-
          echo "${{ secrets.AGE_KEY }}" > ./key.txt
          echo "${{ secrets.PRIVATE_KEY }}" > ./private_key.pem

      - name: Deploy
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_USER: ${{ github.repository_owner }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |-
          SOPS_AGE_KEY_FILE=$(pwd)/key.txt \
          PRIVATE_KEY_PATH="$(pwd)/private_key.pem" \
          ./scripts/deploy.sh ${{ needs.build-push.outputs.unique_docker_tag }}