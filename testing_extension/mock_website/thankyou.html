<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Thank You - Mock Website</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <div class="thank-you">
      <div class="confirmation-box">
        <h1>Order Confirmed!</h1>
        <div class="order-details">
          <h2>Order Summary</h2>
          <div class="product-info">
            <p class="product-name">Loading...</p>
            <p class="product-price">Loading...</p>
          </div>
          <div class="payment-info">
            <p>Payment ID: <span id="payment-id">Loading...</span></p>
            <p>Status: <span class="success-badge">Paid</span></p>
          </div>
        </div>
        <p class="success-message">Thank you for your purchase!</p>
        <a href="purchase.html" class="button">Continue Shopping</a>
      </div>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const params = new URLSearchParams(window.location.search);
      const productName = params.get('product');
      const productPrice = params.get('price');
      const paymentIntent = params.get('payment_intent');

      if (productName && productPrice) {
        document.querySelector('.product-name').textContent = productName;
        document.querySelector('.product-price').textContent = productPrice;
      }
      if (paymentIntent) {
        document.getElementById('payment-id').textContent = paymentIntent;
      }
    });
  </script>
</body>
</html>
