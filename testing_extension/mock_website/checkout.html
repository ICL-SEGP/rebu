<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkout - Mock Website</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="container">
      <nav>
        <h1>Mock Store</h1>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="purchase.html">Products</a></li>
          <li><a href="checkout.html">Checkout</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <h2>Complete Your Purchase</h2>
    <form id="checkout-form" class="form-group">
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <div id="card-element" class="form-group">
        <!-- Stripe Card Element will be inserted here -->
      </div>
      <button type="submit" class="button">Complete Purchase</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2024 Mock Store. All rights reserved.</p>
  </footer>

  <script src="https://js.stripe.com/v3/"></script>
  <script src="stripe.js"></script>
</body>
</html>
