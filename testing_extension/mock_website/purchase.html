<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Products - Mock Website</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="container">
      <nav>
        <h1>Mock Store</h1>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="purchase.html">Products</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <h2>Our Products</h2>
    <div class="products-grid">
      <div class="product-card">
        <img src="https://via.placeholder.com/400" alt="Premium Headphones" class="product-image">
        <h3>Premium Headphones</h3>
        <p>High-quality wireless headphones with noise cancellation</p>
        <p class="price">$199.99</p>
        <form id="checkout-form" data-product-id="prod_1">
          <button type="submit" class="button">Buy Now</button>
        </form>
      </div>
      <div class="product-card">
        <img src="https://via.placeholder.com/400" alt="Smart Watch" class="product-image">
        <h3>Smart Watch</h3>
        <p>Advanced smartwatch with health tracking features</p>
        <p class="price">$299.99</p>
        <form id="checkout-form" data-product-id="prod_2">
          <button type="submit" class="button">Buy Now</button>
        </form>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2024 Mock Store. All rights reserved.</p>
  </footer>

  <script src="stripe.js"></script>
</body>
</html>
