<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirect Page</title>
  <script>
    // Redirect to target.html after 2 seconds
    setTimeout(function() {
      window.location.href = "target.html";
    }, 2000);
  </script>
</head>
<body>
  <p>This page will redirect to target.html in 2 seconds.</p>
</body>
</html>
