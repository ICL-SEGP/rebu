name: Frontend Tests

on:
  push:
    paths:
      - "/app/*"
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Run tests
      - uses: actions/setup-node@v3
      - with:
          - node-version: ${{ matrix.node-version }}
          - cache: 'npm'
      - env: 
          - CI: true
        working-directory: "./app"
        run:
          - npm ci 
          - npm test