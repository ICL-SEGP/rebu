name: Frontend Tests

on:
  push:
    paths:
      - "/app/*"
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: "Run tests"
        env: 
          CI: true
        run: |
          npm ci 
          npm test
        working-directory: "./app"