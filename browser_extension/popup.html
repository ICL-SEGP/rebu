<!DOCTYPE html>
<html>
<head>
  <title>Affiliate Tracker</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      min-width: 350px;
      margin: 0; 
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 20px;
      max-width: 350px;
      margin: 0 auto;
    }
    .card-header h2 {
      margin: 0 0 4px;
    }
    .card-header p {
      margin: 0;
      color: #666;
      font-size: 0.9rem;
    }

    /* Tabs */
    .tabs {
      display: flex;
      margin: 16px 0;
    }
    .tabs button {
      flex: 1;
      padding: 8px;
      border: none;
      background: #e0e0e0;
      cursor: pointer;
      transition: background 0.3s;
    }
    .tabs button.active {
      background: #4f46e5;
      color: #fff;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    /* Inputs & Buttons */
    input, button {
      width: 100%;
      margin-bottom: 8px;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }
    button {
      background: #4f46e5;
      color: #fff;
      border: none;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #4338ca;
    }
    #logout {
      background: #ef4444; /* Red button for logout */
    }

    /* Status & Logs */
    .status-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 8px;
      background-color: gray;
      display: inline-block;
    }
    #log {
      max-height: 150px;
      overflow-y: auto;
      border: 1px solid #ccc;
      padding: 8px;
      background: #fafafa;
      font-size: 0.8rem;
    }
    #conversionBadge {
      display: none;
      background: #22c55e;
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      margin-top: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <h2>Affiliate Tracker</h2>
      <p>Monitor and track affiliate purchases</p>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button id="tab-login" class="active">Login</button>
      <button id="tab-status">Status</button>
      <button id="tab-logs">Logs</button>
    </div>

    <!-- LOGIN TAB -->
    <div id="content-login" class="tab-content active">
      <input type="text" id="username" placeholder="Username">
      <input type="password" id="password" placeholder="Password">
      <button id="login">Login</button>
      <p id="message"></p>
    </div>

    <!-- STATUS TAB -->
    <div id="content-status" class="tab-content">
      <div style="margin-bottom: 8px;">
        <span class="status-indicator" id="affiliate_link_pressed"></span>
        Affiliate Link Clicked
      </div>
      <div style="margin-bottom: 8px;">
        <span class="status-indicator" id="confirmation_page"></span>
        Confirmation Reached
      </div>
      <div style="margin-bottom: 8px;">
        <span class="status-indicator" id="item_detected"></span>
        Item Confirmed
      </div>
      <div id="permissionStatus" style="margin: 8px 0; font-size: 0.9rem;"></div>
      <button id="enableTracking">Enable Tracking</button>
      <button id="disableTracking" style="background: #d32f2f;">Disable Tracking</button>
      <button id="logout">Logout</button>
      <div id="conversionBadge">Conversion Complete!</div>
    </div>

    <!-- LOGS TAB -->
    <div id="content-logs" class="tab-content">
      <div id="log">No events tracked.</div>
      <button id="clearLog" style="background: #ef4444;">Clear Log</button>
    </div>
  </div>

  <!-- Tabs Switching Script -->
  <script>

  </script>

  <!-- Your extension logic -->
  <script src="popup.js"></script>
</body>
</html>
