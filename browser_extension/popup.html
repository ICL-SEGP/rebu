<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Affiliate Tracker</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    :root {
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
      --danger: #ef4444;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-500: #6b7280;
      --gray-700: #374151;
      --gray-900: #111827;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      --radius-md: 8px;
      --radius-sm: 6px;
      --transition: 0.2s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--gray-50);
      color: var(--gray-900);
      min-width: 380px;
      line-height: 1.5;
    }

    .card {
      background-color: white;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      width: 380px;
      margin: 16px auto;
      overflow: hidden;
    }

    .card-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--gray-200);
      background: linear-gradient(to right, #f5f7ff, #eef2ff);
    }

    .card-header h2 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--gray-900);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-header h2::before {
      content: "";
      display: inline-block;
      width: 18px;
      height: 18px;
      background-color: var(--primary);
      border-radius: 4px;
    }

    .card-header p {
      margin: 4px 0 0;
      color: var(--gray-500);
      font-size: 0.875rem;
    }

    /* Tabs */
    .tabs {
      display: flex;
      background-color: white;
      border-bottom: 1px solid var(--gray-200);
      padding: 0 8px;
    }

    .tabs button {
      flex: 1;
      padding: 14px 8px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--gray-500);
      transition: all var(--transition);
      position: relative;
      margin: 0 4px;
    }

    .tabs button:hover {
      color: var(--primary);
    }

    .tabs button.active {
      color: var(--primary);
      font-weight: 600;
    }

    .tabs button.active::after {
      content: "";
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 2px;
      background-color: var(--primary);
      border-radius: 2px 2px 0 0;
    }

    /* Tab Content */
    .tab-content {
      display: none;
      padding: 24px;
    }

    .tab-content.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Form elements */
    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--gray-700);
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--gray-300);
      font-size: 0.875rem;
      transition: border var(--transition), box-shadow var(--transition);
      outline: none;
      color: var(--gray-900);
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    input::placeholder {
      color: var(--gray-500);
    }

    /* Buttons */
    button {
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all var(--transition);
      width: 100%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    /* Button variants */
    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
      box-shadow: var(--shadow);
    }

    .btn-success {
      background-color: var(--success);
      color: white;
    }

    .btn-success:hover {
      background-color: #0ea271;
      box-shadow: var(--shadow);
    }

    .btn-danger {
      background-color: var(--danger);
      color: white;
    }

    .btn-danger:hover {
      background-color: #dc2626;
      box-shadow: var(--shadow);
    }

    .btn-outline {
      background-color: transparent;
      border: 1px solid var(--gray-300);
      color: var(--gray-700);
    }

    .btn-outline:hover {
      background-color: var(--gray-50);
      border-color: var(--gray-400);
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 0.75rem;
    }

    .button-group {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .button-group button {
      flex: 1;
    }

    /* Status indicators */
    .status-list {
      margin-bottom: 20px;
    }

    .status-item {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      padding: 10px;
      border-radius: var(--radius-sm);
      background-color: var(--gray-50);
      transition: background-color var(--transition);
    }

    .status-item:hover {
      background-color: var(--gray-100);
    }

    .status-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 12px;
      background-color: var(--gray-300);
      position: relative;
      flex-shrink: 0;
    }

    .status-indicator.active {
      background-color: var(--success);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
    }

    .status-indicator.active::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 6px;
      height: 6px;
      background-color: white;
      border-radius: 50%;
    }

    .status-text {
      font-size: 0.875rem;
      font-weight: 500;
    }

    /* Permission Status */
    #permissionStatus {
      margin: 16px 0;
      padding: 12px;
      border-radius: var(--radius-sm);
      background-color: var(--gray-50);
      font-size: 0.875rem;
      color: var(--gray-700);
      border-left: 3px solid var(--primary);
    }

    /* Log area */
    #log {
      max-height: 180px;
      overflow-y: auto;
      border: 1px solid var(--gray-200);
      padding: 12px;
      background: var(--gray-50);
      font-size: 0.8125rem;
      border-radius: var(--radius-sm);
      margin-bottom: 16px;
      color: var(--gray-700);
      line-height: 1.6;
    }

    #log:empty::before {
      content: "No events tracked.";
      color: var(--gray-500);
      font-style: italic;
    }

    .log-entry {
      padding: 6px 0;
      border-bottom: 1px solid var(--gray-200);
    }

    .log-entry:last-child {
      border-bottom: none;
    }

    /* Conversion badge */
    #conversionBadge {
      display: none;
      background: var(--success);
      color: white;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      margin-top: 16px;
      text-align: center;
      font-weight: 500;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    /* Login/Message text */
    #message {
      margin-top: 12px;
      font-size: 0.875rem;
      color: var(--gray-700);
      text-align: center;
      min-height: 20px;
    }

    .message-error {
      color: var(--danger);
    }

    .message-success {
      color: var(--success);
    }

    /* Icons */
    .icon {
      width: 18px;
      height: 18px;
      stroke-width: 2;
      stroke: currentColor;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <h2>Affiliate Tracker</h2>
      <p>Monitor and track affiliate purchases</p>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button id="tab-login" class="active">Login</button>
      <button id="tab-status">Status</button>
      <button id="tab-logs">Logs</button>
    </div>

    <!-- LOGIN TAB -->
    <div id="content-login" class="tab-content active">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter your username">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password">
      </div>
      <button id="login" class="btn-primary">
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
          <polyline points="10 17 15 12 10 7"></polyline>
          <line x1="15" y1="12" x2="3" y2="12"></line>
        </svg>
        Login
      </button>
      <p id="message"></p>
    </div>

    <!-- STATUS TAB -->
    <div id="content-status" class="tab-content">
      <div class="status-list">
        <div class="status-item">
          <span class="status-indicator" id="affiliate_link_pressed"></span>
          <span class="status-text">Affiliate Link Clicked</span>
        </div>
        <div class="status-item">
          <span class="status-indicator" id="confirmation_page"></span>
          <span class="status-text">Confirmation Reached</span>
        </div>
        <div class="status-item">
          <span class="status-indicator" id="item_detected"></span>
          <span class="status-text">Item Confirmed</span>
        </div>
      </div>
      
      <div id="permissionStatus"></div>
      
      <div class="button-group">
        <button id="enableTracking" class="btn-success">
          <svg class="icon" viewBox="0 0 24 24">
            <path d="M5 12h14"></path>
            <path d="M12 5v14"></path>
          </svg>
          Enable Tracking
        </button>
        <button id="disableTracking" class="btn-danger">
          <svg class="icon" viewBox="0 0 24 24">
            <path d="M5 12h14"></path>
          </svg>
          Disable Tracking
        </button>
      </div>
      
      <button id="logout" class="btn-outline">
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        Logout
      </button>
      
      <div id="conversionBadge">
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
        Conversion Complete!
      </div>
    </div>

    <!-- LOGS TAB -->
    <div id="content-logs" class="tab-content">
      <div id="log"></div>
      <button id="clearLog" class="btn-danger">
        <svg class="icon" viewBox="0 0 24 24">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
        Clear Log
      </button>
    </div>
  </div>

  <!-- Your extension logic -->
  <script src="popup.js"></script>
</body>
</html>
