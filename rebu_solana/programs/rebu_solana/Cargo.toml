[package]
name = "rebu_solana"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "rebu_solana"

[[bin]]
name = "rebu_solana"
path = "./tests/rebu_solana.rs"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
solana-program = "2.2.1"
solana-sdk = "2.2.1" # Go to 2.0.25 if needed
# solana-client = "2.0.25"
# spl-associated-token-account = "~6"
# spl-token-2022 = { version = "~7", features = ["no-entrypoint"] }
